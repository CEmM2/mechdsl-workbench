[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mechdsl-workbench"
version = "0.2.1"
description = "A standalone browser workbench for MechDSL mechanics compilation and algo2code transpilation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Shmuel Osovski" },
]
keywords = ["mechdsl", "algo2code", "latex", "finite-elements", "taichi", "compiler", "transpiler", "workbench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jinja2>=3.1,<4",
    "packaging>=24,<26",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

# One-command full stack: workbench + the engine it drives.
# ACTIVATION GATE: uncomment this block only AFTER mechdsl-core 0.2.1 and
# algo2code 0.2.1 are live on PyPI — until then `uv lock` cannot resolve it.
# Keep the bounds in lock-step with MECHDSL_WORKBENCH_SUPPORTED_MECHDSL in
# src/mechdsl_workbench/config.py (currently >=0.2.0,<0.3.0) — same contract,
# two spellings.
# [project.optional-dependencies]
# mechdsl = [
#     "mechdsl-core[verify]>=0.2.1,<0.3",
#     "algo2code>=0.2.1,<0.3",
# ]

[project.scripts]
mechdsl-workbench = "mechdsl_workbench.cli:main"

[project.urls]
Repository = "https://github.com/SOSOVSKI/mechdsl-workbench"
MechDSL = "https://github.com/SOSOVSKI/MechDSL"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.7,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechdsl_workbench = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "examples/data/*.tex",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "contract: tests requiring an installed compatible mechdsl-core",
    "integration: tests spanning the HTTP application or worker boundary",
    "unit: focused tests that do not require mechdsl-core",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
